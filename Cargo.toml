[workspace]
members = [
    "crates/ask-core",
    "crates/ask-ipc",
    "crates/ask-scheduler",
    "crates/ask-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Khalid Farooq <khalidanswers404@gmail.com>"]
license = "MIT"
repository = "https://github.com/khalidfarooq/agent-swarm-kernel"

[workspace.dependencies]
ask-core = { path = "crates/ask-core" }
ask-ipc = { path = "crates/ask-ipc" }
ask-scheduler = { path = "crates/ask-scheduler" }

crossbeam-utils = "0.8"
crossbeam-channel = "0.5"
rtrb = "0.3"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
indicatif = "0.17"
clap = { version = "=4.4.18", features = ["derive"] }
libc = "0.2"
